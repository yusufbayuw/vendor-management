name: One-off Import Formatting

on:
  push:
    branches: [feat/legacy-import-queue-preview-20261010]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/legacy-import-queue-preview-20261010
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, xmlreader
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Laravel Pint
        run: vendor/bin/pint
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize import queue code with Laravel Pint'
            git push origin HEAD:refs/heads/feat/legacy-import-queue-preview-20261010
          fi
