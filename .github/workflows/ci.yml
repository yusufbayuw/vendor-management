name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Verify Filament assets
        run: |
          test -f public/css/filament/filament/app.css
          test -f public/js/filament/filament/app.js
          test -f public/js/filament/schemas/schemas.js
          test -f public/js/filament/tables/tables.js

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Fresh install and seed
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test

      - name: Validate routes
        run: php artisan route:list --except-vendor

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  mariadb-import:
    name: MariaDB legacy import
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-ci-password
          MARIADB_DATABASE: vendor_ci
          MARIADB_USER: vendor_ci
          MARIADB_PASSWORD: vendor-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: vendor_ci
      DB_USERNAME: vendor_ci
      DB_PASSWORD: vendor-ci-password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: database
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup PHP with MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip, xmlreader, gd
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migrate MariaDB
        run: php artisan migrate:fresh --force
      - name: Test legacy imports on MariaDB
        run: php artisan test tests/Feature/Foundation/LegacyImportServiceTest.php
