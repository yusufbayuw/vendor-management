name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Filament assets
        run: |
          test -f public/css/filament/filament/app.css
          test -f public/js/filament/filament/app.js
          test -f public/js/filament/schemas/schemas.js
          test -f public/js/filament/tables/tables.js

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Fresh install and seed
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test

      - name: Validate routes
        run: php artisan route:list --except-vendor

      - name: Check formatting
        run: vendor/bin/pint --test
