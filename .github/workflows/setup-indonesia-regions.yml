name: Setup Indonesia Regions Dependency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-indonesia-regions.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none

      - name: Install current dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Indonesia regions dependency
        run: composer require laravolt/indonesia:^0.41 --no-interaction --with-all-dependencies --no-progress

      - name: Commit deterministic dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "build: install Indonesia regions dependency"
          git push origin HEAD:main
