name: One-off Phase 2 Formatting

on:
  push:
    branches: [fix/phase2-finance-approvals-20261010]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/phase2-finance-approvals-20261010
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Laravel Pint
        run: vendor/bin/pint
      - name: Commit code style fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize phase 2 Laravel Pint formatting'
            git push origin HEAD:refs/heads/fix/phase2-finance-approvals-20261010
          fi
