name: Format once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Format source
        run: vendor/bin/pint

      - name: Commit canonical formatting and lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: format code and lock dependencies"
            git push origin main
          fi
